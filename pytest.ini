[pytest]
# Test discovery spans each package's own tests/ directory.  The repo-root conftest.py
# puts the repo root on sys.path so ``ios_decoder`` and the root-level helpers resolve;
# ``proto``/``macho`` resolve via the apple_protobuf_extractor editable install; pytest
# puts apple_protobuf_extractor/ on the path when it collects that package's tests/.
testpaths = apple_protobuf_extractor/tests ios_decoder/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra: show a short summary of skips/xfails at the end (the live cache/binary
#      tests skip cleanly when their artifact is absent — make that visible).
addopts = -ra

# Live tests load a real dyld cache or Mach-O binary in setUpClass and gate on artifact
# presence (iphone8_data/dylib, iphone8_data/locationd, or the MACHO_TEST_CACHE /
# MACHO_TEST_BINARY env paths).
# slow: the classes that take half a minute or more (whole-image extractions and the
#       emulation oracles); `-m "not slow"` leaves them out.
# xdist_group (pytest-xdist's): the classes reading tests/_live.py's shared extraction
#       share one worker under `--dist loadgroup`, so the image is extracted once.
markers =
    slow: takes half a minute or more (a whole-image extraction or oracle)
    xdist_group(name): pytest-xdist's; registered here too for a run without it
